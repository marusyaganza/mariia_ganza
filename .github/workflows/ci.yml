# Install from the lockfile, then lint, type check and build.
# Runs on pushes to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push to the same branch cancels the older run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Keep CI out of Sentry: no events sent, no source map upload
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      SENTRY_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      # Reads the Node version from the `volta` field in package.json.
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json

      # Node 24's corepack provides the Yarn version from the
      # `packageManager` field (Yarn 4), not the runner's Yarn 1.
      - run: corepack enable

      - name: Find the Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      # Fails if yarn.lock is out of date with package.json
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn type-check
      - run: yarn build
